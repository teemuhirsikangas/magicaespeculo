# Template sensors for go-e charger phase monitoring (goecharger-mqtt 2.x)
# Add this to your configuration.yaml:
#
# template: !include goe_phase_limiter_templates.yaml

- sensor:
    - name: "Max Phase Current"
      unique_id: max_phase_current
      unit_of_measurement: "A"
      state: >
        {% set phase1 = states('sensor.current_phase_1') | float(0) %}
        {% set phase2 = states('sensor.current_phase_2') | float(0) %}
        {% set phase3 = states('sensor.current_phase_3') | float(0) %}
        {{ ([phase1, phase2, phase3] | max) | round(1) }}
      
    - name: "Phase Overload Status"
      unique_id: phase_overload_status
      state: >
        {% set max_current = states('sensor.max_phase_current') | float(0) %}
        {% if max_current > 25 %}
          overload
        {% elif max_current < 22 %}
          safe
        {% else %}
          normal
        {% endif %}

    - name: "Solar Surplus"
      unique_id: solar_surplus
      unit_of_measurement: "kW"
      state: >
        {% set export_power = states('sensor.momentary_active_export') | float(0) %}
        {% set import_power = states('sensor.momentary_active_import') | float(0) %}
        {{ (export_power - import_power) | round(3) }}

    - name: "Solar pGrid Watts"
      unique_id: solar_pgrid_watts
      unit_of_measurement: "W"
      state: >
        {% set import_kw = states('sensor.momentary_active_import') | float(0) %}
        {% set export_kw = states('sensor.momentary_active_export') | float(0) %}
        {{ ((export_kw - import_kw) * 1000) | round(0) | int }}

    # Water Meter Sensors
    - name: "Water Meter Total"
      unique_id: water_meter_total_m3
      state: "{{ states('sensor.watermeter_value') | float(0) }}"
      unit_of_measurement: "m³"
      device_class: water
      state_class: total_increasing

    - name: "Water Flow Rate"
      unique_id: water_flow_rate
      state: "{{ states('sensor.watermeter_rate') | float(0) }}"
      unit_of_measurement: "m³/min"
      device_class: water
      state_class: measurement

    # Water consumption in liters
    - name: "Water Daily Liters"
      unique_id: water_daily_liters
      state: "{{ (states('sensor.water_daily') | float(0) * 1000) | round(0) | int }}"
      unit_of_measurement: "L"
      icon: mdi:water

    - name: "Water Monthly Liters"
      unique_id: water_monthly_liters
      state: "{{ (states('sensor.water_monthly') | float(0) * 1000) | round(0) | int }}"
      unit_of_measurement: "L"
      icon: mdi:water

    - name: "Water Yearly Liters"
      unique_id: water_yearly_liters
      state: "{{ (states('sensor.water_yearly') | float(0) * 1000) | round(0) | int }}"
      unit_of_measurement: "L"
      icon: mdi:water
